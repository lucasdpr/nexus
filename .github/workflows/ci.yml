name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    # bash -eo pipefail: sem pipefail, `comando | tee log` esconderia a falha de `comando`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Senha aleatória para o administrador da demonstração
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SEED_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      # Cada etapa grava a saída em arquivo; se algo falhar, o fim de cada arquivo vira uma
      # anotação do GitHub, legível pela API pública (sem entrar na página de logs).
      - name: Construir as imagens
        run: docker compose build 2>&1 | tee build.log
      - name: Subir o ambiente
        run: docker compose up -d --wait 2>&1 | tee up.log
      - name: Smoke test (web → proxy → api → banco → worker)
        run: bash scripts/smoke-test.sh 2>&1 | tee smoke.log
      - name: Explicar a falha
        if: failure()
        run: |
          docker compose logs --no-color --tail=80 > services.log 2>&1 || true
          for log in build up smoke services; do
            [ -s "$log.log" ] && bash scripts/ci-annotate.sh "$log.log" "docker/$log"
          done
          true
      - if: always()
        run: docker compose down -v
