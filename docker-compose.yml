# Ambiente completo com um comando: docker compose up --build
# As credenciais do banco valem só para este ambiente local.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    # Aplica migrações e cria a organização de demonstração (idempotente) antes de subir.
    command: >
      sh -c "alembic upgrade head
      && python -m app.cli seed-demo
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db-data:
