# Ambiente completo com um comando: docker compose up --build
# As credenciais do banco valem só para este ambiente; as portas só aceitam conexões
# da própria máquina (127.0.0.1).
x-api-env: &api-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus
  WEB_ORIGIN: http://localhost:3000
  # Embeddings locais, sem chave. Para a Voyage AI: EMBEDDING_PROVIDER=voyage e VOYAGE_API_KEY.
  EMBEDDING_PROVIDER: hashing
  # Vazia: a senha do administrador da demonstração é gerada e aparece uma vez no log da api.
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    # Aplica migrações e cria a organização de demonstração (idempotente) antes de subir.
    command: >
      sh -c "alembic upgrade head
      && python -m app.cli seed-demo
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *api-env
    volumes:
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Mesmo código da API, outro processo: consome a fila de processamento de documentos.
  worker:
    build: ./apps/api
    command: python -m app.worker
    environment: *api-env
    volumes:
      - storage-data:/data/storage
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  storage-data:
